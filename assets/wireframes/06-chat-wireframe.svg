<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="Inter, Helvetica, Arial, sans-serif">
  <style>
    .bg{fill:#FAFAFA}
    .card{fill:#FFFFFF;stroke:#D6D9DE;stroke-width:1.5}
    .bubbleSent{fill:#DADDE1}
    .bubbleReceived{fill:#FFFFFF;stroke:#D6D9DE;stroke-width:1.5}
    .line{fill:#8B8F97}
    .lineOnSent{fill:#6B7078}
    .lineLight{fill:#DADDE1}
    .txt{fill:#3A3F47;font-weight:700}
    .txtMuted{fill:#6B7078}
    .icon{stroke:#6B7078;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .avatar{fill:#DADDE1;stroke:#9AA0A9;stroke-width:1.5}
  </style>

  <rect width="390" height="844" class="bg"/>

  <!-- Header -->
  <rect x="0" y="0" width="390" height="112" fill="#FFFFFF"/>
  <line x1="0" y1="112" x2="390" y2="112" stroke="#D6D9DE" stroke-width="1.5"/>
  <g class="icon" transform="translate(30,80)"><path d="M8 -8 L0 0 L8 8"/><line x1="0" y1="0" x2="16" y2="0"/></g>
  <circle cx="76" cy="80" r="20" class="avatar"/>
  <rect x="106" y="70" width="110" height="11" rx="5.5" class="line"/>
  <rect x="106" y="90" width="90" height="9" rx="4.5" class="lineLight"/>
  <g class="icon" transform="translate(348,80)">
    <circle cx="0" cy="-8" r="1.6" fill="#6B7078" stroke="none"/>
    <circle cx="0" cy="0" r="1.6" fill="#6B7078" stroke="none"/>
    <circle cx="0" cy="8" r="1.6" fill="#6B7078" stroke="none"/>
  </g>

  <!-- Separador de fecha -->
  <rect x="163" y="128" width="64" height="26" rx="13" fill="#EDEEF0"/>
  <text x="195" y="146" font-size="12" font-weight="700" text-anchor="middle" class="txtMuted">Hoy</text>

  <!-- Mensaje enviado (plantilla) -->
  <path d="M100 168 h248 a18 18 0 0 1 18 18 v40 a18 18 0 0 1 -18 18 h-248 a18 18 0 0 1 -18 -18 v-40 a18 18 0 0 1 18 -18 z" class="bubbleSent"/>
  <path d="M366 244 v-14 l-14 14 z" class="bubbleSent"/>
  <rect x="116" y="182" width="216" height="9" rx="4.5" class="lineOnSent"/>
  <rect x="116" y="200" width="180" height="9" rx="4.5" class="lineOnSent"/>
  <rect x="316" y="250" width="44" height="8" rx="4" class="lineLight"/>

  <!-- Mensaje recibido -->
  <path d="M42 272 h230 a18 18 0 0 1 18 18 v34 a18 18 0 0 1 -18 18 h-230 a18 18 0 0 1 -18 -18 v-34 a18 18 0 0 1 18 -18 z" class="bubbleReceived"/>
  <path d="M24 342 v-14 l14 14 z" class="bubbleReceived"/>
  <rect x="58" y="288" width="180" height="9" rx="4.5" class="line"/>
  <rect x="58" y="306" width="130" height="9" rx="4.5" class="line"/>
  <rect x="30" y="348" width="34" height="8" rx="4" class="lineLight"/>

  <!-- Mensaje enviado -->
  <rect x="176" y="370" width="190" height="46" rx="18" class="bubbleSent"/>
  <rect x="196" y="388" width="120" height="9" rx="4.5" class="lineOnSent"/>
  <rect x="316" y="424" width="44" height="8" rx="4" class="lineLight"/>

  <!-- Mensaje recibido -->
  <path d="M42 446 h240 a18 18 0 0 1 18 18 v56 a18 18 0 0 1 -18 18 h-240 a18 18 0 0 1 -18 -18 v-56 a18 18 0 0 1 18 -18 z" class="bubbleReceived"/>
  <rect x="58" y="464" width="190" height="9" rx="4.5" class="line"/>
  <rect x="58" y="482" width="190" height="9" rx="4.5" class="line"/>
  <rect x="58" y="500" width="70" height="9" rx="4.5" class="line"/>
  <rect x="30" y="546" width="26" height="8" rx="4" class="lineLight"/>

  <!-- Tarjeta de cierre de trabajo -->
  <rect x="24" y="556" width="342" height="112" rx="20" fill="#EDEEF0" stroke="#9AA0A9" stroke-width="1.5"/>
  <g class="icon" transform="translate(53,583)"><path d="M9 0 L11.2 6.2 L18 6.2 L12.6 10.2 L14.6 16.5 L9 12.6 L3.4 16.5 L5.4 10.2 L0 6.2 L6.8 6.2 Z"/></g>
  <text x="74" y="588" font-size="15" font-weight="700" class="txt">¿Ya terminó el trabajo?</text>
  <rect x="44" y="602" width="260" height="9" rx="4.5" class="line"/>
  <rect x="44" y="622" width="164" height="40" rx="16" fill="#3A3F47"/>
  <text x="126" y="647" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Calificar trabajo</text>

  <!-- Plantillas rápidas -->
  <text x="24" y="694" font-size="11" font-weight="700" fill="#9AA0A9" letter-spacing="0.8">RESPUESTAS RÁPIDAS</text>
  <rect x="24" y="706" width="146" height="40" rx="20" fill="#FFFFFF" stroke="#3A3F47" stroke-width="1.5"/>
  <text x="97" y="731" font-size="13" font-weight="600" text-anchor="middle" class="txt">Sí, te espero</text>
  <rect x="180" y="706" width="132" height="40" rx="20" fill="#FFFFFF" stroke="#3A3F47" stroke-width="1.5"/>
  <text x="246" y="731" font-size="13" font-weight="600" text-anchor="middle" class="txt">¿Cuánto sale?</text>
  <rect x="322" y="706" width="60" height="40" rx="20" class="card"/>
  <text x="352" y="731" font-size="13" font-weight="600" text-anchor="middle" class="txtMuted">···</text>

  <!-- Barra de escritura -->
  <rect x="0" y="762" width="390" height="82" fill="#FFFFFF"/>
  <line x1="0" y1="762" x2="390" y2="762" stroke="#D6D9DE" stroke-width="1.5"/>
  <circle cx="46" cy="800" r="22" fill="#EDEEF0"/>
  <g class="icon"><line x1="46" y1="791" x2="46" y2="809"/><line x1="37" y1="800" x2="55" y2="800"/></g>
  <rect x="78" y="778" width="230" height="44" rx="22" fill="#EDEEF0"/>
  <rect x="98" y="795" width="140" height="10" rx="5" class="lineLight"/>
  <circle cx="344" cy="800" r="22" fill="#3A3F47"/>
  <path d="M335 800 l18 -8 l-6 8 l6 8 z" fill="#FFFFFF"/>
</svg>
