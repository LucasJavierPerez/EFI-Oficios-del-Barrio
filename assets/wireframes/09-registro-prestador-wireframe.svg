<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="Inter, Helvetica, Arial, sans-serif">
  <style>
    .bg{fill:#FFFFFF}
    .field{fill:#FFFFFF;stroke:#D6D9DE;stroke-width:2}
    .fieldActive{fill:#FFFFFF;stroke:#3A3F47;stroke-width:2}
    .line{fill:#C7CBD1}
    .lineLight{fill:#DADDE1}
    .txt{fill:#3A3F47;font-weight:700}
    .txtMuted{fill:#6B7078}
    .icon{stroke:#6B7078;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
  </style>

  <rect width="390" height="844" class="bg"/>

  <!-- Header -->
  <g class="icon" transform="translate(34,80)"><path d="M8 -8 L0 0 L8 8"/><line x1="0" y1="0" x2="18" y2="0"/></g>
  <text x="72" y="88" font-size="20" class="txt">Crear mi perfil</text>

  <rect x="24" y="112" width="342" height="8" rx="4" fill="#EDEEF0"/>
  <rect x="24" y="112" width="228" height="8" rx="4" fill="#3A3F47"/>
  <text x="24" y="142" font-size="13" font-weight="600" class="txtMuted">Paso 2 de 3 · Tus datos</text>

  <!-- Foto -->
  <circle cx="195" cy="212" r="44" fill="#FAFAFA" stroke="#9AA0A9" stroke-width="2" stroke-dasharray="6 6"/>
  <g class="icon" transform="translate(195,208)">
    <rect x="-16" y="-10" width="32" height="24" rx="6"/>
    <circle cx="0" cy="2" r="7"/>
  </g>
  <text x="195" y="278" font-size="15" font-weight="700" text-anchor="middle" class="txt">Agregar mi foto</text>
  <rect x="115" y="292" width="160" height="9" rx="4.5" class="lineLight"/>

  <!-- Campos -->
  <text x="24" y="342" font-size="14" font-weight="700" class="txt">Nombre y apellido</text>
  <rect x="24" y="352" width="342" height="56" rx="16" class="fieldActive"/>
  <rect x="44" y="376" width="150" height="10" rx="5" class="line"/>

  <text x="24" y="438" font-size="14" font-weight="700" class="txt">¿Cuál es tu oficio?</text>
  <rect x="24" y="448" width="342" height="56" rx="16" class="field"/>
  <rect x="44" y="472" width="100" height="10" rx="5" class="line"/>
  <path d="M336 476 l6 6 l6 -6" class="icon"/>

  <text x="24" y="534" font-size="14" font-weight="700" class="txt">Zona donde trabajás</text>
  <rect x="24" y="544" width="342" height="56" rx="16" class="field"/>
  <circle cx="53" cy="571" r="7" class="icon"/>
  <rect x="74" y="567" width="220" height="10" rx="5" class="line"/>

  <text x="24" y="630" font-size="14" font-weight="700" class="txt">Teléfono de contacto</text>
  <rect x="24" y="640" width="342" height="56" rx="16" class="field"/>
  <rect x="44" y="664" width="130" height="10" rx="5" class="lineLight"/>

  <!-- Nota de privacidad -->
  <rect x="24" y="712" width="342" height="60" rx="16" fill="#EDEEF0"/>
  <circle cx="48" cy="742" r="11" fill="#9AA0A9"/>
  <rect x="70" y="731" width="230" height="9" rx="4.5" class="lineLight"/>
  <rect x="70" y="750" width="200" height="9" rx="4.5" class="lineLight"/>

  <!-- CTA -->
  <rect x="24" y="788" width="342" height="56" rx="16" fill="#3A3F47"/>
  <text x="195" y="823" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Continuar</text>
</svg>
