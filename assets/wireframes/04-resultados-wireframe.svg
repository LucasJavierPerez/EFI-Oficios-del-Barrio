<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="Inter, Helvetica, Arial, sans-serif">
  <style>
    .bg{fill:#FAFAFA}
    .card{fill:#FFFFFF;stroke:#D6D9DE;stroke-width:1.5}
    .chip{fill:#FFFFFF;stroke:#D6D9DE;stroke-width:1.5}
    .chipActive{fill:#3A3F47}
    .line{fill:#C7CBD1}
    .lineLight{fill:#DADDE1}
    .txt{fill:#3A3F47;font-weight:700}
    .txtMuted{fill:#6B7078}
    .icon{stroke:#6B7078;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .avatar{fill:#DADDE1;stroke:#9AA0A9;stroke-width:1.5}
    .badge{fill:#FFFFFF;stroke:#9AA0A9;stroke-width:1.5}
  </style>

  <rect width="390" height="844" class="bg"/>

  <!-- Header -->
  <rect x="0" y="0" width="390" height="112" fill="#FFFFFF"/>
  <line x1="0" y1="112" x2="390" y2="112" stroke="#D6D9DE" stroke-width="1.5"/>
  <g class="icon" transform="translate(34,80)"><path d="M8 -8 L0 0 L8 8"/><line x1="0" y1="0" x2="18" y2="0"/></g>
  <text x="72" y="88" font-size="20" class="txt">Plomeros</text>
  <rect x="310" y="62" width="44" height="40" rx="14" class="chip"/>

  <!-- Chips de filtro -->
  <rect x="24" y="128" width="112" height="44" rx="22" class="chipActive"/>
  <text x="80" y="157" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Cerca mío</text>
  <rect x="146" y="128" width="126" height="44" rx="22" class="chip"/>
  <text x="209" y="157" font-size="14" text-anchor="middle" class="txtMuted">Mejor puntuados</text>
  <rect x="282" y="128" width="126" height="44" rx="22" class="chip"/>
  <text x="336" y="157" font-size="14" text-anchor="middle" class="txtMuted">Disponibles</text>

  <rect x="24" y="196" width="260" height="10" rx="5" class="lineLight"/>

  <!-- Tarjeta 1 -->
  <rect x="24" y="224" width="342" height="126" rx="20" class="card"/>
  <circle cx="66" cy="268" r="28" class="avatar"/>
  <rect x="108" y="248" width="130" height="11" rx="5.5" class="line"/>
  <rect x="108" y="270" width="160" height="9" rx="4.5" class="lineLight"/>
  <g class="icon" transform="translate(108,290)"><path d="M6 0 L7.5 4.2 L12 4.2 L8.4 6.9 L9.8 11 L6 8.4 L2.2 11 L3.6 6.9 L0 4.2 L4.5 4.2 Z"/></g>
  <rect x="128" y="284" width="70" height="10" rx="5" class="lineLight"/>
  <rect x="264" y="240" width="86" height="28" rx="14" class="badge"/>
  <text x="307" y="259" font-size="12" font-weight="700" text-anchor="middle" class="txtMuted">Disponible</text>
  <line x1="24" y1="316" x2="366" y2="316" stroke="#EDEEF0" stroke-width="1.5"/>
  <rect x="44" y="330" width="90" height="10" rx="5" class="lineLight"/>
  <text x="350" y="338" font-size="14" font-weight="700" text-anchor="end" class="txt">Enviar mensaje</text>

  <!-- Tarjeta 2 -->
  <rect x="24" y="366" width="342" height="126" rx="20" class="card"/>
  <circle cx="66" cy="410" r="28" class="avatar"/>
  <rect x="108" y="390" width="120" height="11" rx="5.5" class="line"/>
  <rect x="108" y="412" width="160" height="9" rx="4.5" class="lineLight"/>
  <g class="icon" transform="translate(108,432)"><path d="M6 0 L7.5 4.2 L12 4.2 L8.4 6.9 L9.8 11 L6 8.4 L2.2 11 L3.6 6.9 L0 4.2 L4.5 4.2 Z"/></g>
  <rect x="128" y="426" width="70" height="10" rx="5" class="lineLight"/>
  <rect x="264" y="382" width="86" height="28" rx="14" class="badge"/>
  <text x="307" y="401" font-size="12" font-weight="700" text-anchor="middle" class="txtMuted">Disponible</text>
  <line x1="24" y1="458" x2="366" y2="458" stroke="#EDEEF0" stroke-width="1.5"/>
  <rect x="44" y="472" width="90" height="10" rx="5" class="lineLight"/>
  <text x="350" y="480" font-size="14" font-weight="700" text-anchor="end" class="txt">Enviar mensaje</text>

  <!-- Tarjeta 3 -->
  <rect x="24" y="508" width="342" height="126" rx="20" class="card"/>
  <circle cx="66" cy="552" r="28" class="avatar"/>
  <rect x="108" y="532" width="120" height="11" rx="5.5" class="line"/>
  <rect x="108" y="554" width="140" height="9" rx="4.5" class="lineLight"/>
  <g class="icon" transform="translate(108,574)"><path d="M6 0 L7.5 4.2 L12 4.2 L8.4 6.9 L9.8 11 L6 8.4 L2.2 11 L3.6 6.9 L0 4.2 L4.5 4.2 Z"/></g>
  <rect x="128" y="568" width="70" height="10" rx="5" class="lineLight"/>
  <rect x="252" y="524" width="98" height="28" rx="14" class="badge" stroke-dasharray="3 3"/>
  <text x="301" y="543" font-size="12" font-weight="700" text-anchor="middle" class="txtMuted">No disponible</text>
  <line x1="24" y1="600" x2="366" y2="600" stroke="#EDEEF0" stroke-width="1.5"/>
  <rect x="44" y="614" width="90" height="10" rx="5" class="lineLight"/>
  <text x="350" y="622" font-size="14" font-weight="700" text-anchor="end" fill="#B0B4BB">Enviar mensaje</text>

  <!-- Tarjeta 4 (parcial) -->
  <rect x="24" y="650" width="342" height="126" rx="20" class="card"/>
  <circle cx="66" cy="694" r="28" class="avatar"/>
  <rect x="108" y="674" width="120" height="11" rx="5.5" class="line"/>
  <rect x="108" y="696" width="140" height="9" rx="4.5" class="lineLight"/>
  <rect x="264" y="666" width="86" height="28" rx="14" class="badge"/>
  <text x="307" y="685" font-size="12" font-weight="700" text-anchor="middle" class="txtMuted">Disponible</text>

  <!-- Barra inferior -->
  <rect x="0" y="780" width="390" height="64" fill="#FFFFFF"/>
  <line x1="0" y1="780" x2="390" y2="780" stroke="#D6D9DE" stroke-width="1.5"/>
  <g transform="translate(49,802)">
    <path d="M-11 2 L0 -8 L11 2 V11 H-11 Z" fill="#3A3F47"/>
    <text x="0" y="28" font-size="11" font-weight="700" fill="#3A3F47" text-anchor="middle">Inicio</text>
  </g>
  <g transform="translate(146,802)">
    <rect x="-11" y="-8" width="22" height="17" rx="3" class="icon"/>
    <text x="0" y="28" font-size="11" class="txtMuted" text-anchor="middle">Mensajes</text>
  </g>
  <g transform="translate(244,802)">
    <path d="M0 10 C-14 0 -12 -10 -5 -10 C-2 -10 0 -8 0 -6 C0 -8 2 -10 5 -10 C12 -10 14 0 0 10 Z" class="icon"/>
    <text x="0" y="28" font-size="11" class="txtMuted" text-anchor="middle">Guardados</text>
  </g>
  <g transform="translate(341,802)">
    <circle cx="0" cy="-4" r="6" class="icon"/>
    <path d="M-10 11 a10 10 0 0 1 20 0" class="icon"/>
    <text x="0" y="28" font-size="11" class="txtMuted" text-anchor="middle">Perfil</text>
  </g>
</svg>
