<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="Inter, Helvetica, Arial, sans-serif">
  <style>
    .bg{fill:#FAFAFA}
    .hero{fill:#E9EAEC}
    .card{fill:#FFFFFF;stroke:#D6D9DE;stroke-width:1.5}
    .line{fill:#C7CBD1}
    .lineLight{fill:#DADDE1}
    .txt{fill:#3A3F47;font-weight:700}
    .txtMuted{fill:#6B7078}
    .icon{stroke:#6B7078;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .avatar{fill:#DADDE1;stroke:#9AA0A9;stroke-width:1.5}
    .badge{fill:#FFFFFF;stroke:#9AA0A9;stroke-width:1.5}
  </style>

  <rect width="390" height="844" class="bg"/>

  <!-- Header -->
  <path d="M0 0 H390 V152 Q390 180 362 180 H28 Q0 180 0 152 Z" class="hero"/>
  <g class="icon" transform="translate(34,80)"><path d="M8 -8 L0 0 L8 8"/><line x1="0" y1="0" x2="18" y2="0"/></g>
  <g class="icon" transform="translate(346,80)"><path d="M0 10 C-14 0 -12 -10 -5 -10 C-2 -10 0 -8 0 -6 C0 -8 2 -10 5 -10 C12 -10 14 0 0 10 Z"/></g>

  <!-- Avatar -->
  <circle cx="195" cy="180" r="56" fill="#FFFFFF"/>
  <circle cx="195" cy="180" r="48" class="avatar"/>

  <rect x="130" y="258" width="130" height="14" rx="7" class="line"/>
  <rect x="150" y="284" width="90" height="10" rx="5" class="lineLight"/>

  <rect x="98" y="316" width="94" height="32" rx="16" class="badge"/>
  <text x="145" y="337" font-size="12" font-weight="700" text-anchor="middle" class="txtMuted">Disponible</text>
  <rect x="200" y="316" width="94" height="32" rx="16" class="badge"/>
  <text x="247" y="337" font-size="12" font-weight="700" text-anchor="middle" class="txtMuted">Matriculado</text>

  <!-- Estadísticas -->
  <rect x="24" y="364" width="342" height="84" rx="20" class="card"/>
  <text x="82" y="400" font-size="22" font-weight="700" text-anchor="middle" class="txt">4,8</text>
  <text x="82" y="436" font-size="12" text-anchor="middle" class="txtMuted">Puntuación</text>
  <line x1="139" y1="384" x2="139" y2="428" stroke="#D6D9DE" stroke-width="1.5"/>
  <text x="195" y="400" font-size="22" font-weight="700" text-anchor="middle" class="txt">23</text>
  <text x="195" y="422" font-size="12" text-anchor="middle" class="txtMuted">Trabajos</text>
  <text x="195" y="438" font-size="12" text-anchor="middle" class="txtMuted">calificados</text>
  <line x1="251" y1="384" x2="251" y2="428" stroke="#D6D9DE" stroke-width="1.5"/>
  <text x="308" y="400" font-size="22" font-weight="700" text-anchor="middle" class="txt">6</text>
  <text x="308" y="422" font-size="12" text-anchor="middle" class="txtMuted">cuadras</text>
  <text x="308" y="438" font-size="12" text-anchor="middle" class="txtMuted">de distancia</text>

  <!-- Sobre mí -->
  <text x="24" y="490" font-size="17" class="txt">Sobre mí</text>
  <rect x="24" y="504" width="330" height="9" rx="4.5" class="lineLight"/>
  <rect x="24" y="526" width="310" height="9" rx="4.5" class="lineLight"/>
  <rect x="24" y="548" width="260" height="9" rx="4.5" class="lineLight"/>

  <!-- Opiniones -->
  <text x="24" y="606" font-size="17" class="txt">Opiniones de vecinos</text>
  <text x="366" y="606" font-size="14" text-anchor="end" class="txtMuted">Ver las 23</text>

  <rect x="24" y="620" width="342" height="76" rx="18" class="card"/>
  <circle cx="52" cy="648" r="16" class="avatar"/>
  <rect x="78" y="640" width="60" height="10" rx="5" class="line"/>
  <g class="icon" transform="translate(78,654)"><path d="M5 0 L6.3 3.6 L10 3.6 L7 6 L8.2 9.6 L5 7.4 L1.8 9.6 L3 6 L0 3.6 L3.7 3.6 Z"/></g>
  <rect x="306" y="638" width="40" height="8" rx="4" class="lineLight"/>
  <rect x="44" y="678" width="280" height="10" rx="5" class="lineLight"/>

  <rect x="24" y="706" width="342" height="76" rx="18" class="card"/>
  <circle cx="52" cy="734" r="16" class="avatar"/>
  <rect x="78" y="726" width="60" height="10" rx="5" class="line"/>
  <g class="icon" transform="translate(78,740)"><path d="M5 0 L6.3 3.6 L10 3.6 L7 6 L8.2 9.6 L5 7.4 L1.8 9.6 L3 6 L0 3.6 L3.7 3.6 Z"/></g>
  <rect x="44" y="764" width="260" height="10" rx="5" class="lineLight"/>

  <!-- CTA fija -->
  <rect x="0" y="780" width="390" height="64" fill="#FFFFFF"/>
  <line x1="0" y1="780" x2="390" y2="780" stroke="#D6D9DE" stroke-width="1.5"/>
  <rect x="24" y="790" width="342" height="46" rx="16" fill="#3A3F47"/>
  <text x="212" y="820" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Enviar mensaje</text>
</svg>
